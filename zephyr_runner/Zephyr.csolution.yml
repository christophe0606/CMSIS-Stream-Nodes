# CMSIS-Stream Zephyr hello example for Arm Corstone-300 FVP.
solution:
  created-for: CMSIS-Toolbox@2.14.1

  packs:
    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.5.0
    - pack: AlifSemiconductor::Ensemble@^2.0.0-0

  target-types:
    - type: AVH-SSE-300
      board: V2M-MPS3-SSE-300-FVP
      device: SSE-300-MPS3
      variables:
        - west-board: mps3/corstone300/fvp
      west-defs:
        - DTS_ROOT: ../boards/zephyr/fvp_cs300
        - EXTRA_DTC_OVERLAY_FILE: ../boards/zephyr/fvp_cs300/overlay/i2s_vsi.overlay
        - EXTRA_CONF_FILE: ../boards/zephyr/fvp_cs300/board.conf
      target-set:
        - set:
          images:
            - project-context: Zephyr_runner.Release
          debugger:
            name: Arm-FVP
            model: FVP_Corstone_SSE-300_Ethos-U55
            config-file: ../boards/zephyr/fvp_cs300/fvp_config.txt

    - type: AppKit-E7
      board: Alif Semiconductor::AppKit-E7-AIML
      device: Alif Semiconductor::AE722F80F55D5LS
      variables:
        # west board selection
        - west-board: alif_e7_dk/ae722f80f55d5xx/rtss
      west-defs:
        - EXTRA_DTC_OVERLAY_FILE: ../boards/zephyr/AlifE7/overlay/alif_e7_dk_rtss_he.overlay
      target-set:
        - set:
          debugger:
            name: ULINKplus@pyOCD
            port: 3333
            protocol: swd
            clock: 10000000
          images:
            - project-context: Zephyr_M55_HE.Debug

  build-types:
    - type: Debug
      debug: on
      optimize: debug
      west-defs:
        - CONFIG_DEBUG: y
        - CONFIG_DEBUG_THREAD_INFO: y
        - CONFIG_DEBUG_OPTIMIZATIONS: y

    - type: Release
      optimize: speed
      west-defs:
        - CONFIG_SPEED_OPTIMIZATIONS: y

  projects:
    - west:
        project-id: Zephyr_runner
        app-path: ./
        board: $west-board$
    - west:
        project-id: Zephyr_M55_HE
        app-path: ./
        board: $west-board$_he
        device: :M55_HE

  compiler: GCC
